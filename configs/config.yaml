# ============================================================================
# Shared Hydra configuration for public segment self-forcing SFT and inference.
#
# Fields are organised into nested groups for readability.  At load time,
# config.py's _flatten_cfg() promotes every leaf into the root namespace
# so that downstream code can still do ``cfg.field_name``.
#
# The two public experiment presets override the shared defaults below.
#
# Usage:
#   torchrun ... hymm/train.py +experiment=sft dataset.data_file=train.arrow
#   torchrun ... hymm/inference.py +experiment=inference dit_weight=model.safetensors
# ============================================================================

defaults:
  - _self_
  - override hydra/hydra_logging: disabled
  - override hydra/job_logging: disabled

# ======================== Common ========================
global_seed: 42
output_dir: "./outputs"
dit_weight: null
prompt_video_boundaries: null
tracker: null
name: null

# ======================== Profiling & Benchmarking ========================
profiling:
  # ---- torch.profiler (detailed chrome traces) ----
  is_profiler: false
  profiler_skip_first: 3      # skip first N steps (cold start / compilation)
  profiler_wait: 1             # idle steps between profiling windows
  profiler_warmup: 1           # CUDA warmup steps (traced but discarded)
  profiler_active: 3           # actively profiled steps (traces exported)
  profiler_repeat: 1           # number of profiling cycles
  profiler_exit_after: true    # exit after profiling is done
  profiler_record_memory: false      # record CUDA memory history & dump .pickle (view at pytorch.org/memory_viz)
  profiler_memory_max_entries: 100000  # max allocation events kept by _record_memory_history
  # ---- wall-clock benchmark (lightweight) ----
  is_benchmark: false
  benchmark_warmup_steps: 3    # warmup steps (not timed)
  benchmark_active_steps: 5    # actively measured steps

# Runtime-computed fields (populated by train.py, declared here for struct safety)
vae_spatial_ratio: null
vae_temporal_ratio: null
vae_latent_channels: null

data_path: null

logging:
  log_interval: 20
  swanlab_project: null
  swanlab_workspace: null
  swanlab_api_key: null
  swanlab_host: null
  swanlab_api_host: null
  swanlab_web_host: null


model:
  camera:
    use_camera_control: false
    injection_mode: null  # "action_attn" | "extrinsics_attn" | "residual_norm" (required when use_camera_control is true)
    freeze_dit_for_camera: false
    # Only active when injection_mode == "extrinsics_attn".
    # Restrict extrinsics cross-attention to the first
    # floor(num_double_blocks * fraction) DiT blocks; the rest skip the inject
    # (saves params and FLOPs while keeping the early-layer camera control).
    # 1.0 -> all blocks (legacy behavior); 0.5 -> first half only.
    # Per-segment camera attention (block-diagonal cross-attn over
    # prompt_video_boundaries). Required for per-segment camera dropout.
    per_segment_camera_attn: false
    # Per-chunk camera attention (block-diagonal cross-attn over fixed-size
    # latent-frame chunks instead of prompt segments). When true, the camera
    # cross-attention boundaries are rebuilt internally as
    # [0, cs, 2*cs, ..., T_lat] (cs = camera_chunk_size, latent frames), so each
    # chunk of image tokens only attends to its own chunk of keyboard tokens.
    # This is independent of DF noise grouping / text modulation (still
    # per-segment) and of the per-segment camera dropout gate (still uses
    # prompt_video_boundaries). Requires magi_attention (flex_flash_attn_func).
    per_chunk_camera_attn: false
    # Chunk size in LATENT frames for per_chunk_camera_attn (default 5).
    camera_chunk_size: 5
    # --- Per-segment camera dropout (TRAINING ONLY) ---
    # For multi-segment camera samples, randomly mark a subset of segments as
    # "camera off" (prompt-controlled) so the model learns to switch between
    # camera and text control within a single clip. The camera cross-attention
    # output is hard-gated to 0 on the dropped segments' tokens (same semantics
    # as the joint-bench per-segment has_camera_mask at inference), while the
    # video GT for those segments still carries real motion — teaching the model
    # that an active camera segment must NOT suppress a neighbouring text-only
    # segment's motion. 0.0 disables (default; zero behaviour change).
    per_segment_camera_dropout_p: 0.0
    # Minimum number of segments kept camera-on for a dropped sample (>=1).
    per_segment_camera_dropout_min_on: 1
  dit:
    model_type: HY-Nomas-G/2-32324-MMDiT
    freeze: false
    act_type: silu
    attn_mode: magi_mp_causal
    # Attention backend for segment AR: magi, flex.
    seg_ar_attention_backend: magi
    unpad_zero_tokens: true
    rope_theta: 256
    master_weight_type: fp32
    # Block attention
    ba_attn_chunk_size: 512
    ba_attn_topk: 3
    ba_attn_causal: false
    ba_attn_slice_method: 3D
    ba_attn_full_attn_block_num: 0
    ba_attn_full_attn_every_n_blocks: 0
    # SSTA
    ssta_topk: 2
    ssta_threshold: 0.0
    ssta_enforce_share_topk_block: 1
    ssta_lambda: 0.9
    ssta_sampling_type: similarity
    ssta_adaptive_pool: 0
    ptm_attn_sparse_type: null
    ptm_attn_pad_type: zero
    ptm_attn_use_text_mask: 1
    ptm_attn_mask_share_within_head: 1
    # MOE
    use_moe: 0
    num_experts: 2
    use_mixed_mlp_moe: 1
    moe_topk: 1
    capacity_factor: 1.0
    moe_drop_tokens: 0
    moe_random_routing_dropped_token: 0
    use_cpu_offload: false
    win_size: "3_3_3"
    tile_size: "8_4_4"
    win_ratio: 9
    win_type: fix
  # ======================== Extra Models (VAE, Text Encoder) ========================
  vae:
    name: dcae-v-f32t4c32
    checkpoint: null
    vae_precision: bf16
    vae_tiling: false
    vae_encode_tile_size: -1
    cpu_offload: false
    stable_prefix_streaming: false
  text_encoder:
    name: qwen-2.5vl-7b
    model_name: Qwen/Qwen2.5-VL-7B-Instruct
    text_encoder_precision: bf16
    text_states_dim: 3584
    text_len: 256
    text_encoder_prompt_batch_size: 0  # 3D multi-prompt rows per encoder call; <=0 disables chunking
    text_len_ll_cap: 1000
    tokenizer: qwen-2.5vl-7b
    prompt_template: li-dit-encode-image-json
    prompt_template_video: li-dit-encode-video-json
    hidden_state_skip_layer: 2
    use_attention_mask: true
    use_ll_cap_dataset: false
    text_projection: single_refiner


dataset:
  # Public training reads one self-contained Arrow IPC or Parquet file.
  data_file: null
  video_batch_size: 1
  uncond_p: 0.0
  token_packing: false
  token_packing_sorted_groups_path: null
  token_packing_shuffle_chunks_each_epoch: false
  # JSON prompt processing is also used by segment-AR inference.
  json_prompt_keep_keys: []
  json_prompt_normalize_action_timestamp: false
  json_prompt_clear_timestamps: false
  normalize_displacement_per_video: true

# ======================== Denoising Schedule ========================

training:
  training_mode: null
  finetune_mode: full
  lora:
    rank: 32
    alpha: 32.0
    dropout: 0.0
    adapter_path: null
  # Attention and prompt flags shared with inference.
  cross_segment_text_head_only: true
  intra_segment_action_mask: false
  prev_seg_last_frame_only: false
  ema:
    ema_rates: []
    ema_schedule: []
    skip_ema_load: false
  # Segment serial self-forcing (non-DMD). training_mode: segment_self_forcing.
  # Per packed sample, roll out segments serially through the KV cache so each
  # segment denoises with a history of ONLY the model's own generated latents
  # (matches seg_ar inference). Pure velocity loss; single model, no critic.
  segment_self_forcing:
    timestep_sample_method: "uniform"
    timestep_shift: 3.0
    # Hybrid forcing. For each packed sample, sample
    # K ~ Uniform{0, ..., num_segments-1}; segments [0, K) are written into the
    # KV cache from low-noise ground-truth latents and excluded from the loss.
    # Student self-rollout/loss starts at segment K, so at least one segment is
    # always trained. This is separate from diffusion_forcing's
    # df_random_clean_prefix, which only affects the unified packed DF path.
    df_random_prefix: false
    # Also train each GT-prefix segment with a standard flow-matching loss using
    # timestep_sample_method/timestep_shift. This adds a grad forward before the
    # separate low-noise no-grad cache write, so all segments contribute loss.
    prefix_flow_matching_loss: false
    # Complete each independent segment graph before mutating its KV cache,
    # accumulate unnormalized loss-sum gradients, then divide the accumulated
    # each segment by the packed batch's total valid-element count before its
    # backward, then clip/step once after all segments.
    # This bounds graph/KV-cache lifetime without changing the global loss
    # weighting. Currently requires gradient_accumulation_steps=1 and
    # df_random_prefix=false.
    streaming_backward: false
    # Cached self-generated context is re-noised to a LOW level sampled uniformly
    # in [context_low_t_min, context_low_t_max] (fraction of the noise path;
    # 0=clean, 1=pure noise). Bracket the seg_ar inference cache noise level
    # (cache_at_step after flow-shift) instead of denoising all the way to clean.
    context_low_t_min: 0.1
    context_low_t_max: 0.3
    # true (legacy): reconstruct from the known pure-noise endpoint,
    #   x_low = (noise - v_pred) + t_low * v_pred.
    # false: step directly from the actual noisy model input,
    #   x_low = x_t + (t_low - t) * v_pred.
    end_noise: true
    # A sample's last segment writes its KV into the cache, but no later segment
    # attends to it and the cache is freed as soon as the sample ends. Skipping
    # that write drops one no-grad forward per packed sample and shrinks the KV
    # cache allocation by the last segment's tokens. Set false to restore the
    # previous behaviour.
    skip_last_segment_cache_write: true
    # Move text CFG dropout from the dataset (whole sample) into this transport
    # (per segment), matching seg_ar/joint-bench inference where individual
    # segments run text-uncond (joint_caption_constraint == "empty") while their
    # neighbours stay text-conditioned.
    #
    # A dropped segment runs a conditional and an unconditional pass:
    #   - the velocity MSE loss is taken on the UNCONDITIONAL pass, the only one
    #     that keeps a graph;
    #   - the KV cache is rolled forward with the CONDITIONAL pass's velocity, so
    #     the cached history is always text-conditional (as at inference, where
    #     the cache is written from the CFG-combined latent). That velocity is
    #     consumed detached, so the pass runs under no_grad and costs one extra
    #     forward rather than a whole extra train step;
    #   - camera conditioning, when the segment has it, is injected in BOTH.
    # Requires dataset.uncond_p=0 (the dataset must keep the conditional text so
    # the conditional pass exists).
    segment_dropout: false
    # Per-segment text-drop probability used when segment_dropout=true. Decided
    # from a deterministic per-(global_step, sample_idx) RNG so every SP rank in
    # a group derives the same mask without an extra collective.
    segment_dropout_p: 0.1
  scheduler:
    denoise_type: flow
    flow_path_type: linear
    flow_predict_type: velocity
    flow_loss_weight: null
    flow_train_eps: null
    flow_sample_eps: null
    flow_snr_type: lognorm
    flow_shift_video: null
    flow_reverse: false
    training_timesteps: 1000
    logit_normal_weighting: false
    logit_normal_weighting_std: 1.0
  # ======================== Training ========================
  optimizer:
    name: adamw
    checkpointing_steps: 5
    resume: null
    # HSDP-aware asynchronous checkpointing. For LoRA this saves adapter and
    # complete AdamW state in one shard per dp_shard_sp rank, deduplicated over
    # the dp_replicate dimension, plus scalar/data cursor and per-rank RNG.
    enable_dcp_checkpoint: false
    # When true on an explicit resume: load model weights + optimizer state from
    # the checkpoint, but reset train_steps / dataset cursor (consumed_* / epoch)
    # / LR schedule to 0. Use when resuming weights onto a different dataset and
    # you want iter index, dataset position, and LR warmup to all start from 0.
    reset_progress_on_resume: false
    save_optimizer_state: false
    max_train_steps: null
    learning_rate: 0.0001
    lr_warmup_steps: 10
    max_grad_norm: 1.0
    enable_grad_norm_clip: false 
    adaptive_grad_clip: false
    adaptive_grad_clip_factor: 5.0
    adaptive_grad_clip_min: 0.5
    adaptive_grad_clip_ema_decay: 0.99
    lr_scheduler: constant
    weight_decay: 0.01

parallelism:
  sp_size: 1
  tp_size: 1  # Tensor parallel degree; dense DiT inference projections.
  # Keep text hidden states sequence-sharded across DiT blocks and use the
  # same sequence<->head all-to-all layout as image tokens. Enabled by default
  # for all training configs; set false explicitly to use the legacy
  # replicated-text + head-slice/head-all-gather path.
  text_sequence_parallel: true
  use_dynamic_ring_attention: false
  gradient_accumulation_steps: 1
  selective_checkpointing: 1.0
  gradient_checkpointing: false
  checkpoint_camera_modules: true
  camera_selective_checkpointing: 1.0
  fsdp_sharding_strategy: full
  # Number of data-parallel ranks sharded together in hybrid mode. With SP=8,
  # setting this to 1 keeps one physical 8-GPU node per HSDP shard group.
  fsdp_hybrid_shard_size: null
  fsdp_overlap: true
  # Offload checkpoint block inputs plus selective-checkpoint attention outputs
  # to pinned CPU. Multi-forward modes (including segment_self_forcing) use
  # invocation-unique leases until their shared backward consumes each handle.
  # Supports Magi and FA3. Requires gradient_checkpointing +
  # skip_attn_recompute. Default off.
  offload_activations: false
  # Overlap activation D2H offload and backward H2D prefetch with compute.
  # Effective only when offload_activations=true. Restore lookup is
  # handle-driven, so multiple outstanding segment forwards remain isolated.
  # Default false keeps the synchronous path.
  # OFFLOAD_ASYNC_D2H/H2D remain optional per-direction debugging overrides.
  offload_activations_async: false
  # Shard the frozen, inference-only text encoder with FSDP2 over the Ulysses
  # SP mesh (shard size == sp_size) to save resident GPU memory. Requires sp_size>1.
  shard_text_encoder: true
  # Inference-only CPU residency: when true, Text Encoder is offloaded to CPU outside encoding
  text_encoder_cpu_offload: false
  # Keep DiT on CPU except for the complete denoising phase (including cache writes).
  # dit_cpu_offload and dit_cpu_offload_for_decode cannot both be true.
  # If GPU memory allows, enable only dit_cpu_offload_for_decode.
  # NOTE: dit_cpu_offload and dit_cpu_offload_for_decode cannot be both true at the same time.
  dit_cpu_offload: false
  dit_cpu_offload_for_decode: false

# ======================== Evaluation / Inference ========================
inference:
  save_latents: false
  # PyTorch inference mode
  inference_mode: false
  profile_memory: false
  # null: convert the entire output video; positive integer: frames per uint8/CPU chunk.
  output_chunk_frames: null
  lora_adapter: null
  dit_weight_quantization: none  # int8 requires a validated W8 checkpoint
  kv_cache_quantization: none   # none | int8 | qvg; compressed storage uses BF16 attention
  qvg_kv_cache:
    preset: upstream_default   # quant-videogen==0.1.0 real Triton PRQ codec
    text_storage: int8         # int8 | bf16; QVG only compresses video KV
    seed: 42                   # isolated from the rollout's random generators
    num_bits: 2                # 2 | 4; packed residual bits
    num_stages: 4
    k_centroids: 256
    v_centroids: 256
    block_size: 64
    max_iters: 100
  sliding_window:
    enabled: false              # segment AR, CFG=1, max_cache_segments=null
    past_frames: 36             # latent history only; never caps the current segment
    # recent: shared video/text token budget; uniform: sampled frames + segment text.
    # recent_mix_uniform: keep K//2 recent frames, sample K-K//2 from older history.
    # K=past_frames; archive-backed policies keep all frames while N<=K.
    # temporal_context: mirrored power-spaced distances from the newest frame.
    # recent has no full archive and does not support streaming rollback.
    # Use temporal_context, uniform, or recent_mix_uniform when rollback is needed.
    sampling: recent
    gamma: 2.0                  # temporal_context only; >1 favors recent frames, 1 is evenly spaced
  sparse_attention:
    enabled: false
    # 1-based denoising steps. [] recomputes every call; [3, 6] is approximate.
    route_refresh_steps: []
    dense_first_n_steps: 1
    dense_first_n_layers: 0
    router_pooling: 2x2
    spatial_block_size: 8
    force_self_block: true
    router_mode: cute_bf16
    temporal_block_size: 1
    spatial_shift_mode: none
    query_time_group_size: 1
    selection_scope: global_fraction
    global_keep_fraction: 0.25
    router_workspace_gib: 16
    memory_efficient: false     # compact route/prototype cache and bounded stable sort
    memory_cache_device: cpu    # cpu or cuda; used only with memory_efficient
    memory_attention_heads: 4   # max heads per aligned Flex call; low-memory mode only
    memory_adaptive_heads: false # select 1/2/4 heads from live memory headroom
  sparse_optim:
    enabled: false
    ranges: "off"
    text: "off"
    text_kchunk: 0
    head_view: "off"
  torch_compile: false          # model-level compilation, optional
  num_frames: 1
  save_path: null
  prompt: null
  max_segments: null
  # Generate all turns with full KV history; omit turn 1 only when saving video.
  # Overlay follows the same output crop. Remaining turn padding is unchanged.
  skip_first_turn: false
  video_length: "event"  # "event": use event timestamps to decide length; "frame": use num_frames
  desc_field_first: ""
  desc_field_rest: ""
  keep_keywords: null
  resolve_subject_ids: false
  no_desc_long_after_first: false
  arrow_column: null
  arrow_filename_column: null
  arrow_caption_key: null
  seed: 42
  neg_prompt: null
  video_size: 512
  video_fps: 16
  cfg_scale_video: 6.0
  camera_cfg_scale: 1.0
  # AR two-branch text CFG fallback (used when separate camera CFG is inactive):
  # keep camera conditioning on the current segment's uncond/base branch.
  ar_uncond_with_camera: true
  # seg_ar CFG only: store one persistent canonical KV slot and broadcast its
  # history read-only to all guidance branches. Set false to keep one physical
  # slot per guidance branch and synchronize fully-conditioned history to every
  # other branch at each segment boundary. chunk_ar always keeps physical slots.
  ar_single_slot_cfg_cache: true
  cfg_scale_min: 1.0
  cfg_scale_max: 8.0
  cfg_scale_max_step: 16
  use_dynamic_cfg_scale: false
  # CFG scheduling options
  cfg_schedule: null  # Options: null, skip_first_n
  cfg_skip_steps: 0   # Number of steps to skip CFG
  infer_flow_shift_video: 1.0
  infer_steps_video: 50
  solver_type: euler
  # ======================== Inference Rollout ========================
  rollout_type: one_shot
  max_cache_segments: null
  denoise_mode: ode
  cache_at_step: -1
  # Fixed flow-matching sigma applied to each completed segment before its KV
  # write. 0.0 preserves clean-cache inference. Mutually exclusive with
  # cache_at_step, which already caches an intermediate noisy latent.
  cache_noise_sigma: 0.0
  # Write the KV cache from a latent produced by the CONDITIONAL velocity alone
  # instead of the CFG-combined one. Segment self-forcing training rolls the
  # cache forward with the conditional branch's velocity only (never a guided
  # combination), so with CFG on, legacy (false) caches a history the model was
  # never trained to read: guidance-amplified latents. When true a second latent
  # runs alongside the guided one on its own solver instance, stepped with the
  # conditional branch's prediction, and it is that latent -- at the same
  # cache_at_step snapshot -- whose K/V lands in the cache. Costs no extra
  # forward (the conditional prediction is already computed for CFG); the
  # decoded video still follows the guided trajectory, so guidance stops
  # accumulating through the AR chain. No-op without CFG.
  ar_cache_latent_cond_only: false
  # seg_ar only: decode each complete segment before the next DiT forward.
  # DCAE-V uses synchronous speculative tile decode; PixelUMM uses its distributed
  # temporal-window decoder. Other rollout types reject this opt-in.
  seg_ar_segment_vae_decode: false
  # AR camera-control diagnostic: when true, seg_ar/chunk_ar shifts camera
  # ActionModule RoPE by the generated latent-frame count so camera cross-attn
  # uses the same global time offset as the DiT cache path. Default false keeps
  # legacy local camera RoPE.
  use_global_camera_rope_offset: false
  # inference_chunk_size controls attention granularity during one_shot inference:
  #   0: segment-level causal (segment j sees segments 0..j)
  #   1: full bidirectional (all frames see each other)  [default for one_shot]
  #  >1: chunk-level (uniform groups of chunk_size latent frames)
  inference_chunk_size: 1
  # chunk_ar only: when true, round every segment's latent length UP to a whole
  # multiple of inference_chunk_size so segment boundaries land on the global
  # chunk grid (matching training, which chunks globally). This avoids partial
  # trailing chunks at segment boundaries. Side effect: the generated video is
  # slightly longer than requested (each event extended to a whole chunk).
  pad_segment_to_chunk_size: false
  segment_frame_boundaries: null
  skip_existing: false 
  save_prompt_txt: true
  max_iters: null  # max number of inference iterations (prompt entries) to run; null = all
  # Cross-group prompt assignment. "duration_balanced" estimates each
  # generated video's time and greedily balances total time across groups.
  # Default remains the legacy deterministic stride assignment.
  # prompt_shard_strategy: "round_robin"
  prompt_shard_strategy: "duration_balanced"
  # Camera control trajectory for inference (trajectory name or JSON file path; null = disabled)
  camera_trajectory: null
  # Camera pose normalization at inference. Mirror whatever the training run
  # used (dataset.normalize_* in the training yaml). Leaving these null
  # defers to the root-level (dataset-flattened) value when an inference
  # yaml inherits from a camera training yaml; set explicitly to override.
  normalize_relative_to_first_frame: null
  normalize_framewise: null
  normalize_displacement: null
  # null inherits the dataset/root setting. When true, retain per-segment
  # first-frame/framewise poses but use one translation scale for the full video.
  normalize_displacement_per_video: null
  # Positive inference gain applied AFTER pose/displacement normalization.
  # This is the only translation gain; NPZ/inline scale metadata is ignored.
  # null or 1.0 = original strength; 2.0 = double. Rotation is unchanged.
  trajectory_translation_scale: 1.0
  # Positive inference gain on local rotation angles: Exp(scale * Log(delta_R)).
  # Requires extrinsics_attn and first-frame/framewise normalization when non-unit.
  # Applied before embedding; translation is unchanged. Set to 1.0 to disable.
  trajectory_rotation_scale: 2.5
  # Overlay-only: absolute per-frame displacement threshold (world units) used
  # when discretising a camera trajectory into WASD/arrow keys for the overlay.
  # Slow-but-steady lateral motion (e.g. truck_left/right spread a fixed total
  # distance over the whole segment) has tiny per-frame steps and is dropped by
  # the discretiser default (0.02). Lower it so those motions still light up the
  # keys. Visualisation only — does NOT affect the generated video. null = use
  # the discretiser default (0.02).
  overlay_keys_abs_threshold: 0.002
  monitor:
    poll_interval: 60
    min_step: 0
    step_multiple: 1
    save_path: null  # override default <output_dir>/validation root for monitor_and_infer.sh
