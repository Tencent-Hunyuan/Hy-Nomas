[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hy-nomas"
version = "1.2.0"
description = "Hy-Nomas video generation, fine-tuning, and inference"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    # Core ML packages (no torch dependency)
    "safetensors==0.7.0",
    
    # Video/Image processing (no torch dependency)
    "albumentations==1.4.20",
    "av==13.1.0",
    "decord==0.6.0",
    "imageio==2.36.0",
    "imageio-ffmpeg==0.5.1",
    "moviepy==1.0.3",
    "scikit-video==1.1.11",
    "iopath==0.1.10",
    
    # Data/Scientific
    "scipy==1.14.1",
    "scikit-learn==1.5.2",
    "h5py==3.12.1",
    "pyarrow==22.0.0",
    
    # Configuration/Serialization
    "pyyaml==6.0.1",
    "yacs==0.1.8",
    "shyaml==0.6.2",
    "antlr4-python3-runtime==4.9.3",
    "hydra-core>=1.3",
    
    # Web/API
    "fastapi==0.115.3",
    "uvicorn==0.32.0",
    "gradio==5.3.0",
    "pydantic==2.9.2",
    "aiohttp==3.13.2",
    "aiofiles==23.2.1",
    "websockets==12.0",
    
    # Utilities
    "beautifulsoup4==4.12.3",
    "ftfy==6.3.0",
    "gdown==5.2.0",
    "huggingface-hub==0.36.0",
    "idna==3.6",
    "loguru==0.7.3",
    "matplotlib==3.9.2",
    "pydub==0.25.1",
    "regex==2024.9.11",
    "requests==2.31.0",
    "sentencepiece==0.2.1",
    "six==1.16.0",
    "tabulate==0.9.0",
    "urllib3==2.2.0",
    "wheel==0.44.0",
    "pycryptodome==3.23.0",
    "webdataset==1.0.2",
    
    # Logging/Monitoring
    "gpustat==1.1.1",
    "protobuf>=6.33.5,<8",
    "tensorboard==2.18.0",
    "swanlab",
    "watch==0.2.7",
]

# Install the complete environment with: uv sync --extra all
[project.optional-dependencies]
deprecated = [
    # These packages are shown in early requirements, but no longer need
    "liger-kernel==0.4.1",
    "pytorchvideo==0.1.5",
    "fvcore==0.1.5.post20221221",
    "torchdiffeq==0.2.4",
]
all = [
    # Model dependencies and CUDA attention kernels.
    "transformers==4.57.1",
    "diffusers==0.36.0",
    "accelerate==1.10.1",
    "huggingface-hub==0.36.0",
    "numpy==2.1.3",
    "peft==0.18.0",
    "omegaconf==2.3.0",
    "opencv-python==4.12.0.88",
    "opencv-python-headless==4.12.0.88",
    "tokenizers==0.22.1",
    "einops==0.8.0",
    "pandas==2.3.3",
    "pillow==10.4.0",
    "tqdm==4.67.1",
    "timm==1.0.12",
    "nvidia-cutlass-dsl[cu13]==4.8.0",
    "torch==2.10.0+cu130",
    "flash-attn",
    "flash-attn-3==3.0.0",
    "magi-attention",
    # Build dependencies for attention kernels without build isolation.
    "setuptools>=61.0",
    "packaging",
    "ninja",
    "psutil",
    "versioningit>=3.3.0",
]

[tool.uv]
no-build-isolation-package = ["flash-attn", "flash-attn-3", "magi-attention"]

# FA3 imports torch while preparing metadata; declare its dependencies so uv
# can resolve a fresh environment before building the extension.
[[tool.uv.dependency-metadata]]
name = "flash-attn-3"
version = "3.0.0"
requires-dist = ["torch", "einops", "packaging", "ninja"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
# FA3 is built from the official hopper subdirectory, separately from FA2.
flash-attn-3 = { git = "https://github.com/Dao-AILab/flash-attention.git", tag = "v2.8.3.post2", subdirectory = "hopper" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools.packages.find]
exclude = ["assets*", "docker*", "docs", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "docker*", "docs", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests/inference"]
pythonpath = ["."]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_calls = true
check_untyped_defs = true
no_implicit_optional = true

[tool.setuptools.package-data]
"apps" = ["prompts/*.md", "prompts_i2v/*.md"]
"hymm.models.vae.pixelumm_decoder" = ["csrc/*.cu"]
